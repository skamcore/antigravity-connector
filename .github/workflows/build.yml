name: Windows build and audit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and run isolated audit
        shell: pwsh
        run: ./work/connect/build.ps1 -Audit
      - uses: actions/upload-artifact@v4
        with:
          name: AntigravityConnect-Windows
          path: outputs/AntigravityConnect-Setup.exe
